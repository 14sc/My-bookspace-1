HTML

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>My Bookspace</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{padding:25px 18px;background:#172b4d;text-align:center}
header h1{margin:0;color:#f5c542;font-size:27px}
header p{color:#ddd;margin-bottom:0}
main{padding:20px;max-width:700px;margin:auto}
h2{font-size:21px}
.add{width:100%;padding:16px;background:#f5c542;color:#101827;border:0;border-radius:10px;font-weight:bold;font-size:16px}
.book{background:#20334e;margin:14px 0;padding:16px;border-radius:12px}
.book button{padding:10px;border:0;border-radius:7px;margin:5px 5px 0 0}
.read{background:#f5c542}
.delete{background:#e65b5b;color:white}
#reader{display:none;margin-top:20px}
#pdfFrame{width:100%;height:70vh;background:white;border:0}
.back{padding:12px;margin-bottom:10px}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>📚 MY BOOKSPACE</h1>
<p>Your personal digital library</p>
</header>
<main>
<h2>My Library</h2>
<input type="file" id="fileInput" accept="application/pdf" multiple hidden>
<button class="add" onclick="document.getElementById('fileInput').click()">+ Add PDF Book</button>
<div id="books">Loading library...</div>
<section id="reader">
<button class="back" onclick="closeBook()">← Back to library</button>
<iframe id="pdfFrame"></iframe>
</section>
</main>
<footer>MY BOOKSPACE © 2026</footer>
<script>
let db;
let currentURL=null;
const request=indexedDB.open("MyBookspaceDB",1);
request.onupgradeneeded=e=>{
db=e.target.result;
db.createObjectStore("books",{keyPath:"id",autoIncrement:true});
};
request.onsuccess=e=>{db=e.target.result;showBooks()};
request.onerror=()=>document.getElementById("books").textContent="Library error";
document.getElementById("fileInput").addEventListener("change",e=>{
Array.from(e.target.files).forEach(file=>{
if(file.type!=="application/pdf")return;
const tx=db.transaction("books","readwrite");
tx.objectStore("books").add({name:file.name,file:file});
tx.oncomplete=showBooks;
});
e.target.value="";
});
function showBooks(){
const area=document.getElementById("books");
const req=db.transaction("books","readonly").objectStore("books").getAll();
req.onsuccess=()=>{
area.innerHTML="";
if(!req.result.length){area.textContent="Your library is empty. Add your first PDF book!";return}
req.result.forEach(book=>{
const div=document.createElement("div");
div.className="book";
const title=document.createElement("h3");
title.textContent="📖 "+book.name;
const read=document.createElement("button");
read.className="read";read.textContent="Read";
read.onclick=()=>openBook(book.id);
const del=document.createElement("button");
del.className="delete";del.textContent="Delete";
del.onclick=()=>deleteBook(book.id);
div.append(title,read,del);area.append(div);
});
};
}
function openBook(id){
const req=db.transaction("books","readonly").objectStore("books").get(id);
req.onsuccess=()=>{
if(!req.result)return;
if(currentURL)URL.revokeObjectURL(currentURL);
currentURL=URL.createObjectURL(req.result.file);
document.getElementById("pdfFrame").src=currentURL;
document.getElementById("reader").style.display="block";
document.getElementById("books").style.display="none";
};
}
function closeBook(){
document.getElementById("pdfFrame").src="";
document.getElementById("reader").style.display="none";
document.getElementById("books").style.display="block";
if(currentURL){URL.revokeObjectURL(currentURL);currentURL=null}
}
function deleteBook(id){
if(!confirm("Delete this book?"))return;
const tx=db.transaction("books","readwrite");
tx.objectStore("books").delete(id);
tx.oncomplete=showBooks;
}
</script>
</body>
</html>
